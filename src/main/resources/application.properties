spring.application.name=travel
spring.datasource.url=${TRAVEL_DB_URL:jdbc:mysql://localhost:3306/travel?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${TRAVEL_DB_USERNAME:root}
spring.datasource.password=${TRAVEL_DB_PASSWORD:123456}
spring.sql.init.mode=never
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
travel.jwt.secret=${TRAVEL_JWT_SECRET:change-this-secret-before-production-change-this-secret}
travel.jwt.expiration-minutes=${TRAVEL_JWT_EXPIRATION_MINUTES:480}
server.port=8088
